services:
  app:
    build: .
    container_name: skincarebeauty_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-skincarebeauty}
      DB_USER: ${DB_USER:-skincarebeauty_user}
      DB_PASSWORD: ${DB_PASSWORD:-azertyui}
      MAIL_HOST: ${MAIL_HOST:-mail}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dev@skincarebeauty.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SkincareBeauty}
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    networks:
      - skincarebeauty_network
    restart: unless-stopped

  cron:
    build: .
    container_name: skincarebeauty_cron
    entrypoint: ["sh", "/usr/local/bin/entrypoint-cron.sh"]
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-skincarebeauty}
      DB_USER: ${DB_USER:-skincarebeauty_user}
      DB_PASSWORD: ${DB_PASSWORD:-azertyui}
      MAIL_HOST: ${MAIL_HOST:-mail}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dev@skincarebeauty.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SkincareBeauty}
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    networks:
      - skincarebeauty_network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: skincarebeauty_db
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-jean}
      MYSQL_DATABASE: ${DB_NAME:-skincarebeauty}
      MYSQL_USER: ${DB_USER:-skincarebeauty_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-azertyui}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-jean}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skincarebeauty_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: skincarebeauty_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-skincarebeauty_user}
      PMA_PASSWORD: ${DB_PASSWORD:-azertyui}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - skincarebeauty_network
    restart: unless-stopped

  mail:
    image: axllent/mailpit:latest
    container_name: skincarebeauty_mail
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - skincarebeauty_network
    restart: unless-stopped

volumes:
  db_data:

networks:
  skincarebeauty_network:
    driver: bridge