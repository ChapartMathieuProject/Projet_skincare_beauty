services:
  app:
    build: .
    container_name: skincarebeauty_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db  
      DB_NAME: ${DB_NAME} 
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: mail
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    networks:
      - skincarebeauty_network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: skincarebeauty_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/skincarebeauty.sql:/docker-entrypoint-initdb.d/skincarebeauty.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skincarebeauty_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: skincarebeauty_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - skincarebeauty_network
    restart: unless-stopped

  mail:
    image: axllent/mailpit:latest
    container_name: skincarebeauty_mail
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - skincarebeauty_network
    restart: unless-stopped     

volumes:
  db_data:

networks:
  skincarebeauty_network:
    driver: bridge

